# =====================================================================
#  simcom_rndis_otg 配置文件
#  改完保存，重启（或重新插拔模块）生效。
#  这个文件会被脚本 source，写法必须是纯 sh 的 KEY=VALUE。
# =====================================================================

# 0 = 只负责加载驱动，网络的活交给 Android 自己的以太网服务（推荐）
#     Redmi K Pad（HyperOS）实测：驱动一加载，网卡以 eth0 出现，
#     EthernetTracker 的过滤规则是 (usb|eth)\d+，会自动 DHCP、下发 DNS、
#     把 eth0 注册成 ETHERNET 网络并设为可用默认网络 —— 什么都不用配。
# 1 = 由本模块的 bin/net-up.sh 自己配 IP / 路由 / DNS
#     只在 ROM 没有以太网服务、或者网卡名不匹配时用。
AUTO_NET=0

# 网卡名。auto = 自动识别（优先找 driver 指向 rndis_host 的网卡，其次 usb0/usb1）
IFNAME=auto

# 1 = 先用 DHCP 拿地址（推荐，模块自带 DHCP 服务）
# 0 = 直接用下面的固定地址
DHCP=1

# 固定地址兜底参数（DHCP 失败时也会用它）
STATIC_IP=192.168.0.100
STATIC_PREFIX=24
STATIC_GW=192.168.0.1

# DNS（DHCP 没下发时使用）
DNS1=223.5.5.5
DNS2=119.29.29.29

# 1 = 联网成功后关掉 Wi-Fi 和移动数据，让 usb0 成为唯一默认网络
#     （Android 的策略路由只会在“没有其它默认网络”时走 main 表）
EXCLUSIVE=0

# 1 = 实验性：用 ndc 把 usb0 注册成 netd 的默认网络（能拿到系统级 DNS）
USE_NDC=0
NDC_NETID=97

# 守护进程轮询间隔（秒）
POLL=5

# 日志文件
LOG=/data/local/tmp/simcom_rndis.log
